[project]
name = "factorio-ai-mcp"
version = "0.1.0"
description = "MCP bridge for an in-game Factorio AI character"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0,<3",
    "rcon>=2.0,<3",
]

[dependency-groups]
dev = ["ruff==0.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".factorio-test", ".factorio-ci", ".uv-cache", ".npm-cache", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["production_line"]
