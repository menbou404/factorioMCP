[project]
name = "factorio-ai-mcp"
version = "0.1.0"
description = "MCP bridge for an in-game Factorio AI character"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0,<3",
    "rcon>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_mcp"]
